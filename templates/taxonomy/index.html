{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-3">Taxonomy</h2>

  <header>
    <div class="d-flex align-items-center mb-2">
      <span id="badge-attack"   class="badge me-2">ATT&CK: —</span>
      <span id="badge-cti"      class="badge me-2">CTI: —</span>
      <span id="badge-coverage" class="badge me-3">Coverage: —</span>

      <span id="badge-tax-status" class="badge bg-secondary">
        Status: -
      </span>
      <button id="btn-refresh" class="btn btn-outline-light btn-sm ms-2">Refresh now</button>
    </div>
    <div id="hot-techniques" class="mt-3"></div>

    <div id="status-extra" class="small text-muted mb-2 bg-light dark-mode"></div>
    <div id="hot-techniques" class="mt-3"></div>
  </header>

  <form class="row g-2 align-items-center mb-3" id="filter-form" method="get">
    <div class="col-auto">
      <select name="vocab" id="vocab" class="form-select">
        <option value="">-- Select vocab --</option>
        <option value="attack.technique"
            {% if request.GET.vocab == "attack.technique" or not request.GET.vocab %}
            selected
            {% endif %}>
          ATT&CK Techniques
        </option>
      </select>
    </div>
    <div class="col-auto">
      <input name="q" id="q" class="form-control" placeholder="Search key or label">
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" type="submit">Apply</button>
      <button class="btn btn-success" type="button" id="btn-add">+ Add</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-sm align-middle" id="tax-table">
      <thead>
        <tr>
          <th style="width: 18%">Key</th>
          <th>Label</th>
          <th style="width: 10%">Order</th>
          <th style="width: 14%">Color</th>
          <th style="width: 10%">Enabled</th>
          <th style="width: 16%">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="new-techniques-indicator" class="mt-3"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="termModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="termForm">
      <div class="modal-header">
        <h5 class="modal-title">Taxonomy Term</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id" id="term-id">
        <input type="hidden" name="vocab" id="term-vocab" value="{{ current_vocab }}">
        <div class="mb-2">
          <label class="form-label">Key</label>
          <input name="key" id="term-key" class="form-control" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Label</label>
          <input name="label" id="term-label" class="form-control" required>
        </div>
        <div class="row">
          <div class="col-6 mb-2">
            <label class="form-label">Order</label>
            <input name="order" id="term-order" type="number" class="form-control" value="0">
          </div>
          <div class="col-6 mb-2">
            <label class="form-label">Color (Bootstrap)</label>
            <input name="color" id="term-color" class="form-control" placeholder="danger / warning / info / ...">
          </div>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="term-enabled" name="enabled" checked>
          <label class="form-check-label" for="term-enabled">Enabled</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  const tableBody = document.querySelector("#tax-table tbody");
  const vocabSel  = document.getElementById("vocab");
  const queryInp  = document.getElementById("q");
  const addBtn    = document.getElementById("btn-add");

  async function loadRows() {
    try {
      const params = new URLSearchParams({
        vocab: vocabSel ? (vocabSel.value || "") : "",
        q: queryInp ? (queryInp.value || "") : ""
      });

      const res  = await fetch("/taxonomy/terms/?" + params.toString(), {
        headers: {"X-Requested-With": "XMLHttpRequest"}
      });
      if (!res.ok) throw new Error("Failed to load rows: " + res.status);

      const json = await res.json();

      tableBody.innerHTML = "";
      (json.rows || []).forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><code>${r.key}</code></td>
          <td>
            ${r.color ? `<span class="badge bg-${r.color} me-1">&nbsp;</span>` : ""}
            ${r.label}
          </td>
          <td>${r.order}</td>
          <td>${r.color || ""}</td>
          <td>${r.enabled ? "Yes" : "No"}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" data-edit='${JSON.stringify(r)}'>Edit</button>
            <button class="btn btn-sm btn-outline-danger" data-del='${r.id}'>Delete</button>
          </td>`;
        tableBody.appendChild(tr);
      });
    } catch (err) {
      console.error("loadRows error:", err);
    }
  }

  // open modal for add
  addBtn.addEventListener("click", () => {
    document.getElementById("termForm").reset();
    document.getElementById("term-id").value = "";
    document.getElementById("term-vocab").value = vocabSel ? vocabSel.value : "";
    new bootstrap.Modal(document.getElementById("termModal")).show();
  });

  // edit/delete handlers
  tableBody.addEventListener("click", (e) => {
    const edit = e.target.getAttribute("data-edit");
    const del  = e.target.getAttribute("data-del");

    if (edit) {
      const r = JSON.parse(edit);
      document.getElementById("term-id").value = r.id;
      document.getElementById("term-vocab").value = vocabSel ? vocabSel.value : "";
      document.getElementById("term-key").value = r.key;
      document.getElementById("term-label").value = r.label;
      document.getElementById("term-order").value = r.order;
      document.getElementById("term-color").value = r.color || "";
      document.getElementById("term-enabled").checked = !!r.enabled;
      new bootstrap.Modal(document.getElementById("termModal")).show();
    } else if (del) {
      if (confirm("Delete this term?")) {
        const form = new FormData();
        form.append("id", del);
        fetch("/taxonomy/delete/", {
          method: "POST",
          headers: {"X-CSRFToken": "AQWlV00QmDIcKOKnAninbVUrNScYzCO2K2SK80b4ekareiRD0nQTjsSYvapFEZps"},
          body: form
        }).then(loadRows);
      }
    }
  });

  // save term
  document.getElementById("termForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    fetch("/taxonomy/save/", {
      method: "POST",
      headers: {"X-CSRFToken": "AQWlV00QmDIcKOKnAninbVUrNScYzCO2K2SK80b4ekareiRD0nQTjsSYvapFEZps"},
      body: form
    }).then(r => r.json()).then(j => {
      if (j.ok) {
        bootstrap.Modal.getInstance(document.getElementById("termModal")).hide();
        loadRows();
      } else {
        alert("Save failed");
      }
    });
  });

  // filter form
  document.getElementById("filter-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const url = new URL(window.location);
    url.searchParams.set("vocab", vocabSel ? vocabSel.value : "");
    history.replaceState({}, "", url);
    loadRows();
  });

  // ---- live summary + “hot techniques” helpers ----

  const fmt = dt => dt ? new Date(dt).toLocaleString() : "—";

  function colorBadge(id, iso, maxHours) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("bg-danger","bg-warning","bg-success");
    if (!iso) { el.classList.add("bg-danger"); return; }
    const ageH = (Date.now() - new Date(iso).getTime()) / 36e5;
    el.classList.add(
      ageH <= maxHours     ? "bg-success" :
      ageH <= maxHours * 2 ? "bg-warning" :
                              "bg-danger"
    );
  }

  async function loadSummary() {
    try {
      const res = await fetch("/taxonomy/live/summary/");
      if (!res.ok) throw new Error("summary HTTP " + res.status);
      const s   = await res.json();

      const badgeAttack   = document.getElementById("badge-attack");
      const badgeCti      = document.getElementById("badge-cti");
      const badgeCoverage = document.getElementById("badge-coverage");

      if (badgeAttack)   badgeAttack.textContent   = `ATT&CK: ${fmt(s.attack_last_success)}`;
      if (badgeCti)      badgeCti.textContent      = `CTI: ${fmt(s.cti_last_success)}`;
      if (badgeCoverage) badgeCoverage.textContent = `Coverage: ${fmt(s.coverage_last_success)}`;

      colorBadge("badge-attack",   s.attack_last_success,   48);
      colorBadge("badge-cti",      s.cti_last_success,       2);
      colorBadge("badge-coverage", s.coverage_last_success, 12);

      // Status badge + details
      const statusBadge = document.getElementById("badge-tax-status");
      const statusExtra = document.getElementById("status-extra");
      if (statusBadge) {
        statusBadge.classList.remove("bg-success","bg-warning","bg-danger","bg-secondary");

        if (s.last_run_started === null) {
          statusBadge.classList.add("bg-secondary");
          statusBadge.textContent = "Status: -";
          if (statusExtra) statusExtra.textContent = "";
        } else if (s.last_run_success) {
          statusBadge.classList.add("bg-success");
          statusBadge.textContent = "Status: OK";
          if (statusExtra) {
            statusExtra.textContent =
              `Last refresh: ${fmt(s.last_run_finished)} · ` +
              `${s.last_run_new_count} new techniques in last run`;
          }
        } else {
          statusBadge.classList.add("bg-danger");
          statusBadge.textContent = "Status: FAILED";
          if (statusExtra) {
            statusExtra.textContent =
              `Last failure: ${fmt(s.last_run_started)} · ${s.last_run_error || ""}`;
          }
        }
      }

      // New techniques in last 24h
      const newBox = document.getElementById("new-techniques-indicator");
      if (newBox) {
        if ((s.new_attack_count_24h || 0) > 0) {
          const ids = (s.new_attack_ids_24h || []).slice(0, 10);
          newBox.innerHTML = `
            <div class="alert alert-info mb-0">
              <strong>${s.new_attack_count_24h}</strong> new ATT&CK techniques
              in the last 24h:
              ${ids.map(id => `<code class="me-1">${id}</code>`).join(" ")}
              ${s.new_attack_count_24h > ids.length ? "…" : ""}
            </div>`;
        } else {
          newBox.innerHTML = "";
        }
      }
    } catch (err) {
      console.error("loadSummary error:", err);
    }
  }

  async function loadHotTechniques() {
    try {
      const res  = await fetch("/taxonomy/techniques/stats/?ordering=-sightings_7d");
      if (!res.ok) throw new Error("hot techniques HTTP " + res.status);
      const data = await res.json();
      const top  = (data.results || data.techniques || [])
        .sort((a,b)=> (b.sightings_7d||0)-(a.sightings_7d||0))
        .slice(0,10);

      const html = top.length === 0 ? "" : `
        <h5 class="mb-2">Most Active Techniques (7d)</h5>
        <div class="table-responsive">
          <table class="table table-sm table-dark align-middle">
            <thead>
              <tr>
                <th>ATT&CK</th><th>Technique</th><th>Tactic</th>
                <th class="text-end">7d</th>
                <th class="text-end">30d</th>
                <th>Last seen</th>
              </tr>
            </thead>
            <tbody>
              ${top.map(t => `
                <tr>
                  <td><code>${t.attack_id}</code></td>
                  <td>${t.technique_name || ""}</td>
                  <td>${t.tactic_attack_id || ""}</td>
                  <td class="text-end">${t.sightings_7d ?? 0}</td>
                  <td class="text-end">${t.sightings_30d ?? 0}</td>
                  <td>${t.last_seen ? new Date(t.last_seen).toLocaleString() : "—"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;
      document.getElementById("hot-techniques").innerHTML = html;
    } catch (err) {
      console.error("loadHotTechniques error:", err);
    }
  }

  // manual refresh button triggers background job, then reloads summary/hot table
  document.getElementById("btn-refresh").addEventListener("click", async () => {
    try {
      await fetch("/taxonomy/live/refresh/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "AQWlV00QmDIcKOKnAninbVUrNScYzCO2K2SK80b4ekareiRD0nQTjsSYvapFEZps"
        },
        body: JSON.stringify({ what: "cti" })
      });
      setTimeout(() => {
        loadSummary();
        loadHotTechniques();
      }, 4000);
    } catch (err) {
      console.error("manual refresh error:", err);
    }
  });

  // initial kicks + timers
  loadRows();
  loadSummary();
  loadHotTechniques();

  setInterval(loadRows,          60000);
  setInterval(loadSummary,       30000);
  setInterval(loadHotTechniques, 60000);
})();
</script>

{% endblock %}
